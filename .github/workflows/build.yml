name: APK bauen

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fortsetzung der Nummern aus dem früheren privaten Repo (zuletzt 1.0.41); kleinere Nummern würde Android als Downgrade ablehnen.
      - name: Versionsnummer festlegen
        run: echo "BUILD=$((GITHUB_RUN_NUMBER + 41))" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Signaturschlüssel aus Secrets anlegen
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Secret KEYSTORE_BASE64 fehlt"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore

      - name: APK bauen
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease -PbuildNumber=${{ env.BUILD }}

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk anruf-reminder-1.0.${{ env.BUILD }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: anruf-reminder-apk
          path: anruf-reminder-*.apk

      - name: Prüfsumme und Fingerabdruck ermitteln
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "APK_SHA256=$(sha256sum anruf-reminder-1.0.${{ env.BUILD }}.apk | cut -d' ' -f1)" >> "$GITHUB_ENV"
          FP=$(keytool -list -v -keystore app/release.keystore -storepass "$KEYSTORE_PASSWORD" | grep -m1 'SHA256:' | sed 's/.*SHA256: *//')
          echo "CERT_SHA256=$FP" >> "$GITHUB_ENV"

      - name: Schlüssel wieder löschen
        if: always()
        run: rm -f app/release.keystore

      - name: Release mit APK anlegen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          {
            echo "## Änderungen"
            echo
            echo "${COMMIT_MSG:-Siehe CHANGELOG.md}" | grep -v -E '^(Co-Authored-By|Claude-Session):'
            echo
            echo "Alle Versionen: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)"
            echo
            echo "## Echtheit prüfen"
            echo
            echo "| | SHA-256 |"
            echo "|---|---|"
            echo "| APK-Datei | \`$APK_SHA256\` |"
            echo "| Signatur-Zertifikat | \`$CERT_SHA256\` |"
            echo
            echo "Der Zertifikats-Fingerabdruck muss mit dem im README übereinstimmen."
          } > release-notes.md
          gh release create "v1.0.${{ env.BUILD }}" anruf-reminder-1.0.${{ env.BUILD }}.apk \
            --title "Anruf Reminder 1.0.${{ env.BUILD }}" \
            --notes-file release-notes.md

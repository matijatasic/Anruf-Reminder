name: Fehler melden
description: Etwas funktioniert nicht wie erwartet
labels: [fehler]
body:
  - type: textarea
    id: was
    attributes:
      label: Was ist passiert?
      description: Was hast du erwartet, und was ist stattdessen passiert?
    validations:
      required: true
  - type: textarea
    id: schritte
    attributes:
      label: Schritte zum Nachstellen
      placeholder: |
        1. Erinnerung „Test“ für 14:00, einmalig, angelegt
        2. Handy gesperrt
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App-Version
      placeholder: z. B. 1.0.43
    validations:
      required: true
  - type: input
    id: geraet
    attributes:
      label: Handy-Modell und Android-Version
      placeholder: z. B. Xiaomi 13, Android 15 (HyperOS 2)
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots oder weitere Hinweise
